name: Build NotifHub APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd agent
          gradle wrapper --gradle-version 8.5 2>/dev/null || true
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Zipalign
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | tail -1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign -p -f 4 \
            agent/app/build/outputs/apk/debug/app-debug.apk \
            agent/app/build/outputs/apk/debug/app-aligned.apk

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | tail -1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign \
            --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out agent/app/build/outputs/apk/debug/app-signed.apk \
            agent/app/build/outputs/apk/debug/app-aligned.apk

      - name: Verify Signature
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | tail -1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner verify --verbose \
            agent/app/build/outputs/apk/debug/app-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notifhub-agent-apk
          path: agent/app/build/outputs/apk/debug/app-signed.apk
